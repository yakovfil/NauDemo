<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nau Demo</title>
<link rel="icon" href="data:,">
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
#nau-window { position: fixed; inset: 0; }
#canvas { display: block; width: 100%; height: 100%; }
</style>
<body>
<div id="nau-window"><canvas id="canvas" aria-label="Nau Demo"></canvas></div>
<script>
'use strict';
window.nauDelivery = { state: 'Loading', message: '' };
let deliveryFailure = null;
function fail(message) {
    deliveryFailure ??= message;
    window.nauDelivery = { state: 'Failed', message: deliveryFailure };
    console.error(deliveryFailure);
}
window.Module = {
    canvas:document.getElementById("canvas"),
    onAbort(reason) { fail('Runtime loading or execution aborted: ' + String(reason)); },
    onExit() { console.info("NauDemo exited", window.Module.nauRuntime?.status); }
};
window.addEventListener('error', event => fail('Runtime load or execution error: ' + event.message));
window.addEventListener('unhandledrejection', event => fail('Runtime load or execution error: ' + String(event.reason)));
if (!['http:', 'https:'].includes(location.protocol)) {
    fail('Local file URLs cannot launch this application. Use the packaged Python server.');
} else if (!window.isSecureContext || !window.crossOriginIsolated) {
    fail('A secure, cross-origin isolated page is required. Use the packaged Python server with COOP: same-origin and COEP: require-corp.');
} else if (!window.WebAssembly || !window.Worker || !window.SharedArrayBuffer) {
    fail('This browser must support WebAssembly, Worker and SharedArrayBuffer. Use current Chrome with the packaged server.');
} else if (!(document.getElementById('canvas') instanceof HTMLCanvasElement)) {
    fail('Missing or invalid canvas host.');
} else if (!window.OffscreenCanvas || !HTMLCanvasElement.prototype.transferControlToOffscreen || !document.createElement('canvas').getContext('webgl2')) {
    fail('WebGL 2 and transferable OffscreenCanvas are required.');
} else {
    const loader = document.createElement('script');
    loader.src = 'NauDemo.js';
    loader.onerror = () => fail('Could not load NauDemo.js. Check that all package files are present.');
    document.body.appendChild(loader);
    setTimeout(() => {
        if (!Module.nauRuntime?.status && !deliveryFailure) fail('Runtime startup did not respond within 30 seconds.');
    }, 30000);
}
</script>
</body>
</html>
